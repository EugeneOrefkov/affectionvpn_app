# Update server: serves ./updates over HTTPS via the reverse proxy.
#
# Network model: nginx has NO published ports - it is reachable only from
# containers attached to the shared `updates-net` bridge (the edge reverse
# proxy joins it and proxies to http://updates:80). Only the proxy listens
# on 443 publicly.
#
# After changing this file on the server:
#   git pull && docker compose up -d

services:
  updates:
    image: nginx:alpine
    restart: unless-stopped
    volumes:
      - ./updates:/usr/share/nginx/html:ro
    networks:
      - updates-net

networks:
  updates-net:
    # Fixed name so that containers from other compose projects (caddy)
    # can attach to it as an external network.
    name: updates-net
