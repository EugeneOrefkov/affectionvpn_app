# Update server: serves ./updates over HTTPS via the reverse proxy.
#
# Network model: nginx has NO published ports - it is reachable only from
# containers attached to the shared `affection-app_network` bridge (the edge
# reverse proxy joins it and proxies to http://affection-app:80 - port 80 is
# the container-internal nginx port). Only the proxy listens on 443 publicly.
#
# After changing this file on the server:
#   git pull && docker compose up -d

services:
  affection-app:
    image: nginx:alpine
    restart: unless-stopped
    volumes:
      - ./updates:/usr/share/nginx/html:ro
    networks:
      - affection-app_network

networks:
  affection-app_network:
    # Fixed name so that containers from other compose projects (caddy)
    # can attach to it as an external network.
    name: affection-app_network
