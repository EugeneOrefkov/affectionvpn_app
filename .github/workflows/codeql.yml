# Free static security analysis by GitHub: scans every push and PR for
# Dart-side vulnerabilities and reports them under the Security tab.
# Unlike most third-party scanners, no extra accounts or secrets needed.
name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Weekly catch of CVEs in code we haven't touched recently.
    - cron: '30 6 * * 1'

permissions:
  security-events: write
  contents: read
  actions: read

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        language: ['dart']
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: ${{ matrix.language }}

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v3
        with:
          category: /language:${{ matrix.language }}
