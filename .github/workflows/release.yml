name: Build & Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write
  issues: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.44.8

      - name: Flutter pub get
        run: flutter pub get

      - name: Build release APK
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          MAJOR="${VERSION%%.*}"
          REST="${VERSION#*.}"
          MINOR="${REST%%.*}"
          PATCH="${REST#*.}"
          BUILD_CODE=$((MAJOR * 10000 + MINOR * 100 + PATCH))
          flutter build apk --release \
            --build-name="$VERSION" \
            --build-number="$BUILD_CODE" 2>&1 | tee /tmp/build.log
        env:
          CI: "true"

      - name: Report build failure
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue create \
            --title "CI build failure on $GITHUB_REF_NAME" \
            --body-file /tmp/build.log

      - name: Create GitHub Release
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          gh release create "$GITHUB_REF_NAME" \
            build/app/outputs/flutter-apk/app-release.apk \
            --title "Affection VPN $VERSION" \
            --generate-notes
