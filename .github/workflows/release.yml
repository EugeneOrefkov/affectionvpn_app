name: Build & Release

# Releases are cut by pushing a tag: `git tag v1.3.4 && git push origin v1.3.4`.
# The version comes from the tag name itself, so there is nothing to type and
# no way to release a version that differs from the tag.
on:
  push:
    tags: ['v*']

concurrency:
  # Serialize releases: two tags pushed together are released one after
  # another. Never cancel an in-progress release - a half-published release is
  # worse than a slow one.
  group: release
  cancel-in-progress: false

permissions:
  contents: write
  issues: write

jobs:
  # Gate: the tag must point to a commit that is already on main. This blocks
  # accidental releases from feature branches or reverted commits.
  verify-tag:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Verify tag points to main
        run: |
          git fetch origin main
          if git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "tag commit $GITHUB_SHA is on main"
          else
            echo "::error::tag $GITHUB_REF_NAME does not point to a commit on main - refusing to release"
            exit 1
          fi

  # Explicit quality gate: a release may only ship code that passes analyze
  # and tests, even if something landed on main bypassing CI.
  test:
    needs: verify-tag
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.44.8
          cache: true

      - name: Flutter pub get
        run: flutter pub get

      - name: Analyze
        run: flutter analyze --fatal-infos

      - name: Test
        run: flutter test

  build-apk:
    needs: test
    runs-on: ubuntu-latest
    environment: release
    env:
      # The tag name, e.g. v1.3.4. Steps below strip the leading 'v'.
      VERSION: ${{ github.ref_name }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.44.8

      - name: Flutter pub get
        run: flutter pub get

      - name: Validate signing secrets
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -z "$ANDROID_KEYSTORE_BASE64" ] || \
             [ -z "$ANDROID_KEYSTORE_PASSWORD" ] || \
             [ -z "$ANDROID_KEY_ALIAS" ] || \
             [ -z "$ANDROID_KEY_PASSWORD" ]; then
            echo "::error::release signing secrets are not configured"
            exit 1
          fi

      - name: Prepare signing key
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -e
          mkdir -p "$HOME/.gradle"
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/affectionvpn-release.jks"
          {
            echo "AFFECTION_STORE_FILE=$RUNNER_TEMP/affectionvpn-release.jks"
            echo "AFFECTION_STORE_PASSWORD=$ANDROID_KEYSTORE_PASSWORD"
            echo "AFFECTION_KEY_ALIAS=$ANDROID_KEY_ALIAS"
            echo "AFFECTION_KEY_PASSWORD=$ANDROID_KEY_PASSWORD"
          } >> "$HOME/.gradle/gradle.properties"

      - name: Cache Gradle
        uses: actions/cache@v6
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ hashFiles('android/**/*.gradle*', 'android/gradle.properties', 'pubspec.lock') }}
          restore-keys: |
            gradle-

      - name: Build release APKs
        run: |
          set -o pipefail
          V="${VERSION#v}"
          MAJOR="${V%%.*}"
          REST="${V#*.}"
          MINOR="${REST%%.*}"
          PATCH="${REST#*.}"
          BUILD_CODE=$((MAJOR * 10000 + MINOR * 100 + PATCH))
          # Split-per-ABI first: each variant carries only its own native libs
          # so in-app updates are ~4x smaller than the fat APK.
          flutter build apk --release \
            --build-name="$V" \
            --build-number="$BUILD_CODE" \
            --split-per-abi 2>&1 | tee /tmp/build.log
          # Fat universal APK for manual installs.
          flutter build apk --release \
            --build-name="$V" \
            --build-number="$BUILD_CODE" 2>&1 | tee -a /tmp/build.log
        env:
          CI: "true"

      - name: Verify APK signature
        if: success()
        run: |
          APKSIGNER="$(find "$ANDROID_HOME" -name apksigner -type f 2>/dev/null | sort -V | tail -1)"
          if [ -n "$APKSIGNER" ]; then
            for apk in build/app/outputs/flutter-apk/*-release.apk; do
              echo "verifying $apk"
              "$APKSIGNER" verify --print-certs "$apk" || exit 1
            done
          else
            echo "apksigner not found, skipping signature verification"
          fi

      - name: Report build failure
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ -f /tmp/build.log ]; then
            gh issue create \
              --title "CI build failure on ${VERSION#v}" \
              --body-file /tmp/build.log
          else
            gh issue create \
              --title "CI build failure on ${VERSION#v}" \
              --body "Run failed before the APK build step. See https://github.com/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          fi

      - name: Create GitHub Release
        if: success()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set +e
          V="${VERSION#v}"
          TAG="v$V"
          REPO="$GITHUB_REPOSITORY"
          OUT="build/app/outputs/flutter-apk"
          DIAG="cwd: $(pwd)\n"
          DIAG+="ls dir:\n$(ls -la "$OUT" 2>&1)\n"

          RESP=$(curl -s -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            -d "{\"tag_name\":\"$TAG\",\"name\":\"Affection VPN $V\",\"generate_release_notes\":true}" \
            "https://api.github.com/repos/$REPO/releases")
          RELEASE_ID=$(printf '%s' "$RESP" | python3 -c "import json,sys; print(json.load(sys.stdin).get('id',''))" 2>/dev/null)
          if [ -z "$RELEASE_ID" ]; then
            RELEASE_ID=$(curl -s \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/$REPO/releases/tags/$TAG" \
              | python3 -c "import json,sys; print(json.load(sys.stdin).get('id',''))" 2>/dev/null)
          fi
          if [ -z "$RELEASE_ID" ]; then
            gh issue create --title "Release failed on $TAG" --body "$DIAG\ncreate resp:\n$RESP"
            exit 1
          fi
          DIAG+="release id: $RELEASE_ID\n"

          # The release can be re-run, in which case its assets already exist
          # and the upload API refuses duplicates with "already_exists", so we
          # delete an existing asset with the same name before uploading.
          delete_asset() {
            local name="$1"
            local existing
            existing=$(curl -s \
              -H "Authorization: Bearer $GH_TOKEN" \
              "https://api.github.com/repos/$REPO/releases/$RELEASE_ID/assets?per_page=100" \
              | python3 -c "import json,sys; a=json.load(sys.stdin); print(next((x['id'] for x in a if x['name']=='$name'), ''))" 2>/dev/null)
            if [ -n "$existing" ]; then
              curl -s -X DELETE \
                -H "Authorization: Bearer $GH_TOKEN" \
                "https://api.github.com/repos/$REPO/releases/assets/$existing" >/dev/null
              echo "replaced existing asset: $name"
            fi
          }

          upload_one() {
            local abi="$1" src="$2"
            local name="affection_vpn-$V-$abi.apk"
            if [ ! -f "$src" ]; then
              echo "::error::missing $src"
              gh issue create --title "Asset missing on $TAG" --body "$DIAG"
              exit 1
            fi
            delete_asset "$name"
            upload=$(curl -s -X POST \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H "Content-Type: application/octet-stream" \
              --data-binary "@$src" \
              "https://uploads.github.com/repos/$REPO/releases/$RELEASE_ID/assets?name=$name")
            url=$(printf '%s' "$upload" | python3 -c "import json,sys; print(json.load(sys.stdin).get('browser_download_url',''))" 2>/dev/null)
            if [ -z "$url" ]; then
              gh issue create --title "Asset upload failed on $TAG" --body "$DIAG\nupload resp:\n$upload"
              exit 1
            fi
            echo "uploaded: $name"
          }

          # Upload whatever split-per-abi actually produced: this Flutter
          # version builds arm64-v8a, armeabi-v7a and x86_64 but NOT 32-bit
          # x86, so only existing APKs are uploaded.
          for apk in "$OUT"/*-release.apk; do
            [ -f "$apk" ] || continue
            base=$(basename "$apk")
            if [ "$base" = "app-release.apk" ]; then
              abi="universal"
            else
              abi="${base#app-}"
              abi="${abi%-release.apk}"
            fi
            upload_one "$abi" "$apk"
          done

          # latest.json is written once by the deploy-updates job after all
          # assets exist - two parallel jobs writing it race each other.

  # Runs in parallel with the APK build: the Linux bundle is the slowest part
  # to produce locally, and it only needs the GitHub Release (created by the
  # build-apk job) to exist before uploading, so we poll for it.
  build-linux:
    needs: test
    runs-on: ubuntu-latest
    environment: release
    env:
      VERSION: ${{ github.ref_name }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.44.8

      - name: Flutter pub get
        run: flutter pub get

      - name: Install Linux build dependencies
        run: |
          set -e
          sudo apt-get update -y
          sudo apt-get install -y --no-install-recommends \
            libgtk-3-dev libayatana-appindicator3-dev liblzma-dev \
            ninja-build clang cmake pkg-config dpkg-dev

      - name: Build Linux bundle
        run: |
          set -o pipefail
          V="${VERSION#v}"
          flutter build linux --release --build-name="$V" 2>&1 | tee /tmp/linux-build.log

      - name: Build Linux .deb package
        run: make -C linux deb VERSION="${VERSION#v}"

      - name: Verify bundled Xray core
        run: |
          # make deb rebuilds the bundle via the Makefile's `build` target,
          # which stages the pinned core; assert it is really there before the
          # tarball (which is tarred from the same bundle) is uploaded.
          test -x build/linux/x64/release/bundle/xray
          test -s build/linux/x64/release/bundle/geoip.dat
          test -s build/linux/x64/release/bundle/geosite.dat

      - name: Wait for GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          V="${VERSION#v}"
          TAG="v$V"
          for i in $(seq 1 90); do
            if curl -fsSL \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/$GITHUB_REPOSITORY/releases/tags/$TAG" | grep -q '"id"'; then
              echo "release $TAG found"
              exit 0
            fi
            echo "waiting for release $TAG (${i}/90)..."
            sleep 20
          done
          echo "::error::release $TAG was not created within 30 minutes"
          exit 1

      - name: Upload Linux release assets
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          V="${VERSION#v}"
          TAG="v$V"
          RELEASE_ID=$(curl -s \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/releases/tags/$TAG" \
            | python3 -c "import json,sys; print(json.load(sys.stdin).get('id',''))" 2>/dev/null)
          if [ -z "$RELEASE_ID" ]; then
            echo "::error::release $TAG not found, cannot upload assets"
            exit 1
          fi

          # Helper: upload (or replace) a single asset
          upload_asset() {
            local file="$1"           # path to file on disk
            local name="$2"           # desired asset name
            local mime="$3"           # Content-Type
            # Delete existing asset with the same name
            local existing
            existing=$(curl -s \
              -H "Authorization: Bearer $GH_TOKEN" \
              "https://api.github.com/repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID/assets?per_page=100" \
              | python3 -c "import json,sys; a=json.load(sys.stdin); print(next((x['id'] for x in a if x['name']=='$name'), ''))" 2>/dev/null)
            if [ -n "$existing" ]; then
              curl -s -X DELETE -H "Authorization: Bearer $GH_TOKEN" \
                "https://api.github.com/repos/$GITHUB_REPOSITORY/releases/assets/$existing" >/dev/null
              echo "replaced existing asset: $name"
            fi
            local resp
            resp=$(curl -s -X POST \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H "Content-Type: $mime" \
              --data-binary "@$file" \
              "https://uploads.github.com/repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID/assets?name=$name")
            if ! python3 -c "import json,sys; d=json.loads('$resp'); assert d.get('name')=='$name', d" 2>/dev/null; then
              echo "::warning::failed to upload $name: $resp"
            else
              echo "uploaded: $name"
            fi
          }

          # 1) Portable tarball
          TARBALL="affection-vpn-$V-linux-x64.tar.gz"
          tar -czf "/tmp/$TARBALL" -C build/linux/x64/release/bundle .
          upload_asset "/tmp/$TARBALL" "$TARBALL" "application/gzip"

          # 2) .deb package
          DEB="affection-vpn_${V}_amd64.deb"
          DEB_PATH="build/linux/x64/release/$DEB"
          if [ -f "$DEB_PATH" ]; then
            upload_asset "$DEB_PATH" "$DEB" "application/vnd.debian.binary-package"
          else
            echo "::error::$DEB_PATH not found - deb build failed"
            exit 1
          fi
          # latest.json is written once by the deploy-updates job after all
          # assets exist - two parallel jobs writing it race each other.

      - name: Sync package versions with the tag
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          V="${VERSION#v}"
          TARBALL="/tmp/affection-vpn-$V-linux-x64.tar.gz"
          SHA256=$(sha256sum "$TARBALL" | cut -d' ' -f1)

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # Build steps leave unstaged churn behind (pub get refreshes
          # pubspec.lock) - start from a clean checkout of current main.
          git reset --hard
          git fetch origin main
          BRANCH="bot/sync-package-versions-v$V"
          git checkout -B "$BRANCH" origin/main

          # The tag is the single source of truth: every packaged copy of the
          # version follows it in one housekeeping commit.
          sed -i "s/^pkgver=.*/pkgver=$V/" packaging/arch/PKGBUILD
          sed -i "s/^pkgrel=.*/pkgrel=1/" packaging/arch/PKGBUILD
          python3 -c "import re, sys; h=sys.argv[1]; s=open('packaging/arch/PKGBUILD').read(); s=re.sub(r\"(sha256sums=\(\n\s*')[^']*('\n)\", r'\g<1>'+h+r'\g<2>', s, count=1); open('packaging/arch/PKGBUILD','w').write(s)" "$SHA256"
          sed -i -E "s/^version: .*/version: $V+1/" pubspec.yaml

          git add packaging/arch/PKGBUILD pubspec.yaml
          if git diff --cached --quiet; then
            echo 'package versions already up to date'
          else
            git commit -m "sync package versions to v$V"
            git push --force origin "$BRANCH"
            # Even the release bot ships through a pull request: required
            # checks validate the housekeeping commit and auto-merge lands
            # it as soon as they are green.
            gh pr create \
              --title "sync package versions to v$V" \
              --body "Automated housekeeping for $VERSION: PKGBUILD pkgver/sha256 and pubspec version follow the tag." \
              --head "$BRANCH" \
              --base main || echo "sync PR already exists"
            gh pr merge --squash --auto --delete-branch
          fi

  # Publishes release assets onto the update server. Runs on the self-hosted
  # runner living on the VPS itself: no inbound ports, no SSH keys - the job
  # simply writes files where the local nginx serves them from.
  #
  # This is also the ONLY job that writes latest.json (single writer): both
  # build jobs used to update it in parallel and raced each other.
  deploy-updates:
    needs: [build-apk, build-linux]
    runs-on: [self-hosted, vps]
    env:
      VERSION: ${{ github.ref_name }}
      UPDATES_BASE: https://update.affectiion.ru
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          rm -rf dist && mkdir dist
          gh release download "$VERSION" -R "$GITHUB_REPOSITORY" -D dist --clobber
          ls -la dist

      - name: Build update manifest
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          gh api "repos/$GITHUB_REPOSITORY/releases/tags/$VERSION" \
            --jq '.published_at // ""' > /tmp/published_at
          gh api "repos/$GITHUB_REPOSITORY/releases/tags/$VERSION" \
            --jq '.body // ""' > /tmp/changelog.md
          python3 scripts/build_manifest.py \
            dist "$UPDATES_BASE" "${VERSION#v}" "$VERSION" \
            "$(cat /tmp/published_at)" /tmp/changelog.md > dist/latest.json
          cat dist/latest.json

      - name: Publish to updates dir
        run: |
          set -e
          cp dist/* /opt/affectionvpn_app/updates/
          ls -la /opt/affectionvpn_app/updates/

      - name: Smoke test the update server
        run: |
          set -e
          echo "checking $UPDATES_BASE/latest.json ..."
          curl -fsSI "$UPDATES_BASE/latest.json" | head -1
          curl -fsS "$UPDATES_BASE/latest.json" | \
            python3 -c "import json,sys; d=json.load(sys.stdin); assert d['version']=='${VERSION#v}', d['version']; print('manifest OK, version', d['version'])"

      # Old app versions still read the manifest from the GitHub release;
      # keep a copy there until every client has moved to our server.
      - name: Update latest.json on the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$VERSION" dist/latest.json --clobber -R "$GITHUB_REPOSITORY"
