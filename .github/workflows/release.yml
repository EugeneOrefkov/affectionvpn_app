name: Build & Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write
  issues: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.44.8

      - name: Flutter pub get
        run: flutter pub get

      - name: Build release APK
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          MAJOR="${VERSION%%.*}"
          REST="${VERSION#*.}"
          MINOR="${REST%%.*}"
          PATCH="${REST#*.}"
          BUILD_CODE=$((MAJOR * 10000 + MINOR * 100 + PATCH))
          flutter build apk --release \
            --build-name="$VERSION" \
            --build-number="$BUILD_CODE" 2>&1 | tee /tmp/build.log
        env:
          CI: "true"

      - name: Report build failure
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue create \
            --title "CI build failure on $GITHUB_REF_NAME" \
            --body-file /tmp/build.log

      - name: Create GitHub Release
        if: success()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set +e
          DIAG="cwd: $(pwd)\n"
          DIAG+="find apk:\n$(find . -name '*.apk' 2>&1)\n"
          DIAG+="ls dir:\n$(ls -la build/app/outputs/flutter-apk/ 2>&1)\n"
          APK="$PWD/build/app/outputs/flutter-apk/app-release.apk"
          DIAG+="APK exists: $(test -f "$APK" && echo yes || echo no)\n"
          RESP=$(curl -s -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            -d "{\"tag_name\":\"$GITHUB_REF_NAME\",\"name\":\"Affection VPN ${GITHUB_REF_NAME#v}\",\"generate_release_notes\":true}" \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/releases")
          DIAG+="create resp:\n$RESP\n"
          RELEASE_ID=$(printf '%s' "$RESP" | python3 -c "import json,sys; print(json.load(sys.stdin).get('id',''))" 2>/dev/null)
          if [ -z "$RELEASE_ID" ]; then
            gh issue create --title "Release failed on $GITHUB_REF_NAME" --body "$DIAG"
            exit 1
          fi
          curl -s -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Content-Type: application/octet-stream" \
            --data-binary "@$APK" \
            "https://uploads.github.com/repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID/assets?name=affection_vpn-${GITHUB_REF_NAME#v}.apk" \
            -o /tmp/upload.json
          DIAG+="upload resp:\n$(cat /tmp/upload.json)\n"
          UP_NAME=$(python3 -c "import json; d=json.load(open('/tmp/upload.json')); print(d.get('name') or '')" 2>/dev/null)
          if [ -z "$UP_NAME" ]; then
            gh issue create --title "Asset upload failed on $GITHUB_REF_NAME" --body "$DIAG"
            exit 1
          fi
          echo "uploaded: $UP_NAME"
          printf '%b' "$DIAG"
