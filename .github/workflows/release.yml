name: Build & Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'App version to release (e.g. 1.0.16)'
        required: true

permissions:
  contents: write
  issues: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      # The version comes from the workflow_dispatch input. Runs on main so all
      # GitHub caches (Flutter SDK, Xray AAR, Gradle) are shared across runs.
      VERSION: ${{ inputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.44.8

      - name: Flutter pub get
        run: flutter pub get

      - name: Validate signing secrets
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -z "$ANDROID_KEYSTORE_BASE64" ] || \
             [ -z "$ANDROID_KEYSTORE_PASSWORD" ] || \
             [ -z "$ANDROID_KEY_ALIAS" ] || \
             [ -z "$ANDROID_KEY_PASSWORD" ]; then
            echo "::error::release signing secrets are not configured"
            exit 1
          fi

      - name: Prepare signing key
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -e
          mkdir -p "$HOME/.gradle"
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/affectionvpn-release.jks"
          {
            echo "AFFECTION_STORE_FILE=$RUNNER_TEMP/affectionvpn-release.jks"
            echo "AFFECTION_STORE_PASSWORD=$ANDROID_KEYSTORE_PASSWORD"
            echo "AFFECTION_KEY_ALIAS=$ANDROID_KEY_ALIAS"
            echo "AFFECTION_KEY_PASSWORD=$ANDROID_KEY_PASSWORD"
          } >> "$HOME/.gradle/gradle.properties"

      - name: Cache built Xray AAR
        id: cache-xray-aar
        uses: actions/cache@v4
        with:
          path: android/xray-maven
          key: xray-aar-${{ hashFiles('android/gradle.properties') }}

      - name: Setup Go
        if: steps.cache-xray-aar.outputs.cache-hit != 'true'
        uses: actions/setup-go@v5
        with:
          go-version: '1.26'

      - name: Install Android NDK
        if: steps.cache-xray-aar.outputs.cache-hit != 'true'
        run: |
          set -e
          NDK_DIR="$ANDROID_HOME/ndk/28.2.13676358"
          if [ -d "$NDK_DIR" ]; then
            echo "NDK 28.2.13676358 already present, using it."
            exit 0
          fi
          echo "NDK not preinstalled, installing via sdkmanager..."
          yes | sdkmanager --licenses >/dev/null 2>&1 || true
          yes | sdkmanager "ndk;28.2.13676358"
          test -d "$NDK_DIR" || { echo "::error::NDK install failed"; exit 1; }

      - name: Build Xray core AAR
        if: steps.cache-xray-aar.outputs.cache-hit != 'true'
        run: |
          # ANDROID_HOME must be expanded by the shell here: GitHub Actions
          # does NOT expand $VAR references inside the step-level env block.
          ANDROID_NDK_HOME="$ANDROID_HOME/ndk/28.2.13676358" scripts/build_xray_android.sh

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ hashFiles('android/**/*.gradle*', 'android/gradle.properties', 'pubspec.lock') }}
          restore-keys: |
            gradle-

      - name: Build release APKs
        run: |
          set -o pipefail
          V="${VERSION#v}"
          MAJOR="${V%%.*}"
          REST="${V#*.}"
          MINOR="${REST%%.*}"
          PATCH="${REST#*.}"
          BUILD_CODE=$((MAJOR * 10000 + MINOR * 100 + PATCH))
          # Split-per-ABI first: each variant carries only its own native libs
          # so in-app updates are ~4x smaller than the fat APK.
          flutter build apk --release \
            --build-name="$V" \
            --build-number="$BUILD_CODE" \
            --split-per-abi 2>&1 | tee /tmp/build.log
          # Fat universal APK for manual installs.
          flutter build apk --release \
            --build-name="$V" \
            --build-number="$BUILD_CODE" 2>&1 | tee -a /tmp/build.log
        env:
          CI: "true"

      - name: Verify APK signature
        if: success()
        run: |
          APKSIGNER="$(find "$ANDROID_HOME" -name apksigner -type f 2>/dev/null | sort -V | tail -1)"
          if [ -n "$APKSIGNER" ]; then
            for apk in build/app/outputs/flutter-apk/*-release.apk; do
              echo "verifying $apk"
              "$APKSIGNER" verify --print-certs "$apk" || exit 1
            done
          else
            echo "apksigner not found, skipping signature verification"
          fi

      - name: Report build failure
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ -f /tmp/build.log ]; then
            gh issue create \
              --title "CI build failure on ${VERSION#v}" \
              --body-file /tmp/build.log
          else
            gh issue create \
              --title "CI build failure on ${VERSION#v}" \
              --body "Run failed before the APK build step. See https://github.com/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          fi

      - name: Create GitHub Release
        if: success()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set +e
          V="${VERSION#v}"
          TAG="v$V"
          REPO="$GITHUB_REPOSITORY"
          OUT="build/app/outputs/flutter-apk"
          DIAG="cwd: $(pwd)\n"
          DIAG+="ls dir:\n$(ls -la "$OUT" 2>&1)\n"

          RESP=$(curl -s -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            -d "{\"tag_name\":\"$TAG\",\"name\":\"Affection VPN $V\",\"generate_release_notes\":true}" \
            "https://api.github.com/repos/$REPO/releases")
          RELEASE_ID=$(printf '%s' "$RESP" | python3 -c "import json,sys; print(json.load(sys.stdin).get('id',''))" 2>/dev/null)
          if [ -z "$RELEASE_ID" ]; then
            RELEASE_ID=$(curl -s \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/$REPO/releases/tags/$TAG" \
              | python3 -c "import json,sys; print(json.load(sys.stdin).get('id',''))" 2>/dev/null)
          fi
          if [ -z "$RELEASE_ID" ]; then
            gh issue create --title "Release failed on $TAG" --body "$DIAG\ncreate resp:\n$RESP"
            exit 1
          fi
          DIAG+="release id: $RELEASE_ID\n"

          python3 -c "import json,sys; v,tag=sys.argv[1],sys.argv[2]; json.dump({'version':v,'tag':tag,'published_at':'','changelog':'','assets':{}}, open('/tmp/manifest.json','w'))" "$V" "$TAG"

          # The release can be re-run, in which case its assets already exist
          # and the upload API refuses duplicates with "already_exists", so we
          # delete an existing asset with the same name before uploading.
          delete_asset() {
            local name="$1"
            local existing
            existing=$(curl -s \
              -H "Authorization: Bearer $GH_TOKEN" \
              "https://api.github.com/repos/$REPO/releases/$RELEASE_ID/assets?per_page=100" \
              | python3 -c "import json,sys; a=json.load(sys.stdin); print(next((x['id'] for x in a if x['name']=='$name'), ''))" 2>/dev/null)
            if [ -n "$existing" ]; then
              curl -s -X DELETE \
                -H "Authorization: Bearer $GH_TOKEN" \
                "https://api.github.com/repos/$REPO/releases/assets/$existing" >/dev/null
              echo "replaced existing asset: $name"
            fi
          }

          upload_one() {
            local abi="$1" src="$2"
            local name="affection_vpn-$V-$abi.apk"
            local sha size upload url
            if [ ! -f "$src" ]; then
              echo "::error::missing $src"
              gh issue create --title "Asset missing on $TAG" --body "$DIAG"
              exit 1
            fi
            delete_asset "$name"
            sha=$(sha256sum "$src" | cut -d' ' -f1)
            size=$(stat -c %s "$src")
            upload=$(curl -s -X POST \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H "Content-Type: application/octet-stream" \
              --data-binary "@$src" \
              "https://uploads.github.com/repos/$REPO/releases/$RELEASE_ID/assets?name=$name")
            url=$(printf '%s' "$upload" | python3 -c "import json,sys; print(json.load(sys.stdin).get('browser_download_url',''))" 2>/dev/null)
            if [ -z "$url" ]; then
              gh issue create --title "Asset upload failed on $TAG" --body "$DIAG\nupload resp:\n$upload"
              exit 1
            fi
            echo "uploaded: $name"
            python3 -c "import json,sys; abi,url,size,sha=sys.argv[1],sys.argv[2],int(sys.argv[3]),sys.argv[4]; d=json.load(open('/tmp/manifest.json')); d['assets'][abi]={'apk_url':url,'size':size,'sha256':sha}; json.dump(d, open('/tmp/manifest.json','w'))" "$abi" "$url" "$size" "$sha"
          }

          # Upload whatever split-per-abi actually produced: this Flutter
          # version builds arm64-v8a, armeabi-v7a and x86_64 but NOT 32-bit
          # x86, so only existing APKs are uploaded and listed in latest.json.
          for apk in "$OUT"/*-release.apk; do
            [ -f "$apk" ] || continue
            base=$(basename "$apk")
            if [ "$base" = "app-release.apk" ]; then
              abi="universal"
            else
              abi="${base#app-}"
              abi="${abi%-release.apk}"
            fi
            upload_one "$abi" "$apk"
          done

          REL_JSON=$(curl -s \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/$REPO/releases/$RELEASE_ID")
          python3 -c "import json,sys; d=json.load(open('/tmp/manifest.json')); rel=json.loads(sys.argv[1]); d['published_at']=rel.get('published_at') or ''; d['changelog']=rel.get('body') or ''; json.dump(d, open('/tmp/manifest.json','w'))" "$REL_JSON"

          # Merge any assets already written by the Linux job (e.g. linux-x64,
          # linux-deb) so the last job to finish doesn't clobber the other one.
          curl -sL -o /tmp/latest-existing.json \
            "https://github.com/$REPO/releases/download/$TAG/latest.json" || true
          cat <<'PY' > /tmp/merge-latest.py
          import json, os, sys
          existing, manifest = sys.argv[1], sys.argv[2]
          try:
              old = json.load(open(existing))
          except Exception:
              old = {'assets': {}}
          d = json.load(open(manifest))
          d.setdefault('assets', {})
          for k, v in old.get('assets', {}).items():
              if k not in d['assets']:
                  d['assets'][k] = v
          json.dump(d, open(manifest, 'w'))
          PY
          python3 /tmp/merge-latest.py /tmp/latest-existing.json /tmp/manifest.json

          delete_asset latest.json
          curl -s -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Content-Type: application/json" \
            --data-binary "@/tmp/manifest.json" \
            "https://uploads.github.com/repos/$REPO/releases/$RELEASE_ID/assets?name=latest.json" \
            -o /tmp/latest-upload.json
          python3 -c "import json; d=json.load(open('/tmp/latest-upload.json')); assert d.get('name')=='latest.json', d"
          echo "uploaded: latest.json"
          cat /tmp/manifest.json

  # Runs in parallel with the APK build: the Linux bundle is the slowest part
  # to produce locally, and it only needs the GitHub Release (created by the
  # build job) to exist before uploading, so we poll for it.
  build-linux:
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ inputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.44.8

      - name: Flutter pub get
        run: flutter pub get

      - name: Install Linux build dependencies
        run: |
          set -e
          sudo apt-get update -y
          sudo apt-get install -y --no-install-recommends \
            libgtk-3-dev liblzma-dev ninja-build clang cmake pkg-config dpkg-dev

      - name: Build Linux bundle
        run: |
          set -o pipefail
          V="${VERSION#v}"
          flutter build linux --release --build-name="$V" 2>&1 | tee /tmp/linux-build.log

      - name: Build Linux .deb package
        run: make -C linux deb

      - name: Wait for GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          V="${VERSION#v}"
          TAG="v$V"
          for i in $(seq 1 90); do
            if curl -fsSL \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/$GITHUB_REPOSITORY/releases/tags/$TAG" | grep -q '"id"'; then
              echo "release $TAG found"
              exit 0
            fi
            echo "waiting for release $TAG (${i}/90)..."
            sleep 20
          done
          echo "::error::release $TAG was not created within 30 minutes"
          exit 1

      - name: Upload Linux release assets
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          V="${VERSION#v}"
          TAG="v$V"
          RELEASE_ID=$(curl -s \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/releases/tags/$TAG" \
            | python3 -c "import json,sys; print(json.load(sys.stdin).get('id',''))" 2>/dev/null)
          if [ -z "$RELEASE_ID" ]; then
            echo "::error::release $TAG not found, cannot upload assets"
            exit 1
          fi

          # Helper: upload (or replace) a single asset
          upload_asset() {
            local file="$1"           # path to file on disk
            local name="$2"           # desired asset name
            local mime="$3"           # Content-Type
            # Delete existing asset with the same name
            local existing
            existing=$(curl -s \
              -H "Authorization: Bearer $GH_TOKEN" \
              "https://api.github.com/repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID/assets?per_page=100" \
              | python3 -c "import json,sys; a=json.load(sys.stdin); print(next((x['id'] for x in a if x['name']=='$name'), ''))" 2>/dev/null)
            if [ -n "$existing" ]; then
              curl -s -X DELETE -H "Authorization: Bearer $GH_TOKEN" \
                "https://api.github.com/repos/$GITHUB_REPOSITORY/releases/assets/$existing" >/dev/null
              echo "replaced existing asset: $name"
            fi
            local resp
            resp=$(curl -s -X POST \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H "Content-Type: $mime" \
              --data-binary "@$file" \
              "https://uploads.github.com/repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID/assets?name=$name")
            if ! python3 -c "import json,sys; d=json.loads('$resp'); assert d.get('name')=='$name', d" 2>/dev/null; then
              echo "::warning::failed to upload $name: $resp"
            else
              echo "uploaded: $name"
            fi
          }

          # 1) Portable tarball
          TARBALL="affection-vpn-$V-linux-x64.tar.gz"
          tar -czf "/tmp/$TARBALL" -C build/linux/x64/release/bundle .
          upload_asset "/tmp/$TARBALL" "$TARBALL" "application/gzip"

          # 2) .deb package
          DEB="affection-vpn_${V}_amd64.deb"
          DEB_PATH="build/linux/x64/release/$DEB"
          if [ -f "$DEB_PATH" ]; then
            upload_asset "$DEB_PATH" "$DEB" "application/vnd.debian.binary-package"
          else
            echo "::warning::$DEB_PATH not found, skipping .deb upload"
          fi

          # 3) Update latest.json with Linux assets
          delete_asset() {
            local name="$1" existing
            existing=$(curl -s -H "Authorization: Bearer $GH_TOKEN" \
              "https://api.github.com/repos/$REPO/releases/$RELEASE_ID/assets?per_page=100" \
              | python3 -c "import json,sys; a=json.load(sys.stdin); print(next((x['id'] for x in a if x['name']=='$name'), ''))" 2>/dev/null)
            if [ -n "$existing" ]; then
              curl -s -X DELETE -H "Authorization: Bearer $GH_TOKEN" \
                "https://api.github.com/repos/$REPO/releases/assets/$existing" >/dev/null
              echo "replaced existing asset: $name"
            fi
          }
          TAR_PATH="/tmp/affection-vpn-$V-linux-x64.tar.gz"
          DEB_PATH="build/linux/x64/release/affection-vpn_${V}_amd64.deb"
          REPO="$GITHUB_REPOSITORY"
          # Create from scratch if latest.json hasn't been uploaded by the Android job yet.
          curl -sL -o /tmp/latest-linux.json \
            "https://github.com/$REPO/releases/download/$TAG/latest.json" || true
          python3 -c "import json,sys; json.load(open(sys.argv[1]))" /tmp/latest-linux.json 2>/dev/null || \
            echo '{"version":"'"$V"'","tag":"'"$TAG"'","assets":{}}' > /tmp/latest-linux.json

          cat <<'PY' > /tmp/update-latest.py
          import hashlib, json, os, sys
          v, r, t = sys.argv[1], sys.argv[2], sys.argv[3]
          d = json.load(open('/tmp/latest-linux.json'))
          d.setdefault('assets', {})
          as_ = d['assets']
          tar_path = '/tmp/affection-vpn-' + v + '-linux-x64.tar.gz'
          tar_url = 'https://github.com/' + r + '/releases/download/' + t + '/affection-vpn-' + v + '-linux-x64.tar.gz'
          as_['linux-x64'] = {
            'tar_url': tar_url,
            'size': os.path.getsize(tar_path),
            'sha256': hashlib.sha256(open(tar_path, 'rb').read()).hexdigest()
          }
          deb_path = 'build/linux/x64/release/affection-vpn_' + v + '_amd64.deb'
          if os.path.exists(deb_path) and os.path.getsize(deb_path) > 0:
            deb_url = 'https://github.com/' + r + '/releases/download/' + t + '/affection-vpn_' + v + '_amd64.deb'
            as_['linux-deb'] = {
              'deb_url': deb_url,
              'size': os.path.getsize(deb_path),
              'sha256': hashlib.sha256(open(deb_path, 'rb').read()).hexdigest()
            }
          json.dump(d, open('/tmp/latest-linux.json', 'w'))
          PY
          python3 /tmp/update-latest.py "$V" "$REPO" "$TAG"

          delete_asset latest.json
          curl -s -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Content-Type: application/json" \
            --data-binary "@/tmp/latest-linux.json" \
            "https://uploads.github.com/repos/$REPO/releases/$RELEASE_ID/assets?name=latest.json" \
            -o /tmp/latest-upload.json
          python3 -c "import json; d=json.load(open('/tmp/latest-upload.json')); assert d.get('name')=='latest.json', d"
          echo "updated latest.json with Linux assets"
