name: Build experimental core

on:
  workflow_dispatch:
    inputs:
      version:
        description: >-
          Xray-core version to build (e.g. 1.8.24). Leave empty to build the
          latest release tag.
        required: false
        default: ''

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version: '1.26'

      - name: Install Android NDK
        run: |
          set -e
          NDK_DIR="$ANDROID_HOME/ndk/28.2.13676358"
          if [ -d "$NDK_DIR" ]; then
            echo "NDK 28.2.13676358 already present, using it."
            exit 0
          fi
          echo "NDK not preinstalled, installing via sdkmanager..."
          yes | sdkmanager --licenses >/dev/null 2>&1 || true
          yes | sdkmanager "ndk;28.2.13676358"
          test -d "$NDK_DIR" || { echo "::error::NDK install failed"; exit 1; }

      - name: Build libxray.so from sources
        run: |
          set -e
          # ANDROID_HOME must be expanded by the shell here: GitHub Actions
          # does NOT expand $VAR references inside the step-level env block.
          export ANDROID_NDK_HOME="$ANDROID_HOME/ndk/28.2.13676358"
          VERSION="${{ inputs.version }}"
          scripts/build_xray_experimental.sh ${VERSION:+"$VERSION"}

      - name: Resolve built version
        id: version
        run: |
          V="$(ls build/experimental/libxray-arm64-v8a-*.so 2>/dev/null | head -1 | sed 's/.*libxray-arm64-v8a-\([0-9.]*\)\.so/\1/')"
          test -n "$V" || { echo "::error::no built artifacts found"; exit 1; }
          echo "version=$V" >> "$GITHUB_OUTPUT"

      - name: Publish to experimental-core branch
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          V="${{ steps.version.outputs.version }}"

          git fetch origin experimental-core || true
          if git rev-parse -q --verify origin/experimental-core; then
            git checkout -B experimental-core origin/experimental-core
          else
            git checkout --orphan experimental-core
            git rm -rf --quiet . || true
          fi

          # The built .so files (build/ is gitignored, so they survive the
          # branch switch) are copied to the branch root. Older versions stay
          # in place, so any previously built version stays downloadable.
          cp build/experimental/libxray-*.so .
          git add libxray-*.so
          git commit -m "experimental core v$V" || echo "no changes to commit"
          git push origin experimental-core
          echo "Published: https://github.com/$GITHUB_REPOSITORY/tree/experimental-core"
