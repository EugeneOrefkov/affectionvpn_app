name: Update Xray core

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Preview what would change without bumping anything'
        type: boolean
        default: false

permissions:
  contents: write
  actions: write
  issues: write

concurrency:
  group: core-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Dry run
        if: inputs.dry_run == 'true'
        run: python3 .github/scripts/update_core.py --dry-run

      - name: Bump core and app version
        if: inputs.dry_run != 'true'
        id: bump
        run: |
          OUTPUT=$(python3 .github/scripts/update_core.py)
          echo "$OUTPUT"
          echo "NEW_VERSION=$(printf '%s' "$OUTPUT" | sed -n 's/^NEW_VERSION=//p')" >> "$GITHUB_OUTPUT"
          echo "TAG_VERSION=$(printf '%s' "$OUTPUT" | sed -n 's/^TAG_VERSION=//p')" >> "$GITHUB_OUTPUT"

      - name: Detect changes
        id: detect
        run: |
          if git diff --exit-code --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Commit and push version bump
        if: steps.detect.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add android/gradle.properties pubspec.yaml
          git commit -m "update xray core to ${{ steps.bump.outputs.TAG_VERSION }}"
          git pull --rebase origin main
          git push origin HEAD:main

      - name: Dispatch release build
        if: steps.detect.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run release.yml -f "version=${{ steps.bump.outputs.TAG_VERSION }}"

      - name: Report failure
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue create \
            --title "Core update workflow failed" \
            --body "Run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
